<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TRIBERIUM — SocialFi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- =========================================================
     CORE CSS
========================================================= -->
<style>
/* =========================================================
   DESIGN SYSTEM
========================================================= */
:root{
  --primary:#7b2cbf;
  --primary-dark:#5a189a;
  --bg:#f6f2ff;
  --card:#ffffff;
  --text:#111;
  --muted:#6b7280;
  --border:rgba(123,44,191,0.15);
  --action:#7b2cbf;
  --danger:#dc2626;
}
[data-theme="dark"]{
  --bg:#0f0f14;
  --card:#1a1a22;
  --text:#f5f5f7;
  --muted:#9ca3af;
  --border:rgba(255,255,255,0.08);
  --action:#a855f7;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);transition:0.3s ease;overflow-x:hidden;}

/* =========================================================
   HEADER
========================================================= */
.header{position:sticky;top:0;z-index:1000;backdrop-filter:blur(16px);background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.header-top{display:flex;justify-content:space-between;align-items:center;}
.menu-btn,.theme-toggle{width:36px;height:36px;border:none;background:none;cursor:pointer;font-size:1.3rem;color:var(--primary);display:flex;align-items:center;justify-content:center;transition:0.3s;}
.menu-btn:hover,.theme-toggle:hover{transform:scale(1.1);}
.logo{font-size:1.7rem;font-weight:800;background:linear-gradient(90deg,var(--primary),#a855f7,var(--primary-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.wallet{font-size:0.8rem;font-weight:600;color:var(--primary);}
.search input{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);outline:none;}
.search input:focus{border-color:var(--primary);box-shadow:0 0 12px rgba(123,44,191,0.25);}

/* =========================================================
   SIDEBAR
========================================================= */
.sidebar{position:fixed;top:0;right:-300px;width:280px;height:100vh;background:var(--card);border-left:1px solid var(--border);padding:30px 20px;display:flex;flex-direction:column;gap:18px;transition:0.4s ease;z-index:2000;}
.sidebar.active{right:0;}
.sidebar button{background:none;border:none;text-align:left;font-weight:600;cursor:pointer;color:var(--primary);}
.sidebar button:hover{transform:translateX(6px);color:var(--primary-dark);}

/* =========================================================
   STORIES
========================================================= */
.stories{display:flex;overflow-x:auto;gap:14px;padding:14px 16px;}
.story{flex:0 0 85px;height:145px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:6px;cursor:pointer;transition:0.3s;}
.story:hover{transform:translateY(-4px);}
.story img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);}
.story span{font-size:0.7rem;margin-top:6px;}

/* =========================================================
   FEED
========================================================= */
.page{padding:20px;padding-bottom:120px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:20px;}
.post-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);}
.follow-btn{background:var(--primary);border:none;color:white;padding:6px 14px;border-radius:20px;cursor:pointer;transition:0.3s;}
.follow-btn:hover{background:var(--primary-dark);}
.post-actions{display:flex;justify-content:space-between;margin-top:14px;}
.action{flex:1;text-align:center;cursor:pointer;font-weight:600;font-size:0.85rem;color:var(--action);}
.action.active{color:var(--primary-dark);}
.comment-modal,.logout-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:3000;}
.comment-modal .modal-content,.logout-modal .modal-content{background:var(--card);padding:20px;border-radius:12px;width:90%;max-width:500px;display:flex;flex-direction:column;gap:12px;}
.comment-modal .modal-content textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);resize:none;}
.comment-modal .modal-content button,.logout-modal .modal-content button{align-self:flex-end;padding:8px 16px;border:none;border-radius:12px;background:var(--primary);color:white;cursor:pointer;transition:0.3s;}
.logout-modal .modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px;}
.logout-modal .modal-actions button.cancel{background:var(--danger);}

/* =========================================================
   BOTTOM NAV
========================================================= */
.nav{position:fixed;bottom:0;width:100%;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:12px 0;}
.nav button{background:none;border:none;color:var(--muted);cursor:pointer;}
.nav button.active{color:var(--primary);transform:scale(1.2);transition:0.3s;}
</style>

<!-- =========================================================
     LINK FUTURE CSS FILES
========================================================= -->
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/feed-actions.css">
<link rel="stylesheet" href="css/stories.css">

</head>
<body data-theme="light">

<header class="header">
  <div class="header-top">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div>
      <div class="logo">TRIBERIUM</div>
      <div class="wallet">TBM Balance: <span id="walletAmount">0.00</span></div>
    </div>
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </div>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search TRIBERIUM...">
  </div>
</header>

<div class="sidebar" id="sidebar">
  <button data-route="profile">Profile</button>
  <button data-route="metrics">Metrics</button>
  <button data-route="news">News</button>
  <button data-route="zytherion">Access Zytherion</button>
  <button data-route="livestream">Live Stream</button>
  <button data-route="saved">Saved Posts</button>
  <button data-route="wallet">Wallet</button>
  <button data-route="settings">Settings</button>
  <button id="logoutBtn">Logout</button>
</div>

<section class="stories" id="stories"></section>
<section class="page" id="feed"></section>

<div class="comment-modal" id="commentModal">
  <div class="modal-content">
    <textarea id="commentText" placeholder="Write a comment..."></textarea>
    <button id="submitComment">Post</button>
  </div>
</div>

<div class="logout-modal" id="logoutModal">
  <div class="modal-content">
    <div>Are you sure you want to logout?</div>
    <div class="modal-actions">
      <button id="confirmLogout">Yes, Logout</button>
      <button class="cancel" id="cancelLogout">Cancel</button>
    </div>
  </div>
</div>

<nav class="nav">
  <button class="active" data-route="home">Home</button>
  <button data-route="tribe">Tribe</button>
  <button data-route="chat">Chat</button>
  <button data-route="notifications">Notifications</button>
</nav>

<!-- =========================================================
     CORE JS
========================================================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, onSnapshot, query, orderBy, setDoc, addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjX9SLUbKPjldZELBvtQg0K0A-UEDLRIs",
  authDomain: "triberium-mvp.firebaseapp.com",
  projectId: "triberium-mvp",
  storageBucket: "triberium-mvp.firebasestorage.app",
  messagingSenderId: "519861052514",
  appId: "1:519861052514:web:56348e80320066cd311d3b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===================== AUTH & WALLET ===================== */
onAuthStateChanged(auth,user=>{
  if(!user) window.location.href="index.html"; 
  loadWallet(user.uid);
  loadStories();
  loadFeed(user.uid);
});

function loadWallet(uid){
  onSnapshot(doc(db,"wallets",uid),snap=>{
    if(snap.exists()){
      document.getElementById("walletAmount").textContent=Number(snap.data().balance).toFixed(2);
    }
  });
}

/* ===================== THEME TOGGLE ===================== */
document.getElementById("themeToggle").onclick=()=>{
  const body=document.body;
  body.dataset.theme = body.dataset.theme==="light"?"dark":"light";
  document.getElementById("themeToggle").textContent = body.dataset.theme==="light"?"🌙":"☀️";
};

/* ===================== SIDEBAR ===================== */
const sidebar=document.getElementById("sidebar");
document.getElementById("menuBtn").onclick=()=>sidebar.classList.toggle("active");
sidebar.querySelectorAll("button[data-route]").forEach(btn=>{
  btn.onclick=()=>{sidebar.classList.remove("active");console.log("Route:",btn.dataset.route);}
});

/* ===================== LOGOUT ===================== */
const logoutBtn=document.getElementById("logoutBtn");
const logoutModal=document.getElementById("logoutModal");
const confirmLogout=document.getElementById("confirmLogout");
const cancelLogout=document.getElementById("cancelLogout");

logoutBtn.onclick=()=>logoutModal.style.display="flex";
cancelLogout.onclick=()=>logoutModal.style.display="none";
confirmLogout.onclick=async()=>{
  await signOut(auth);
  window.location.href="index.html";
};

/* ===================== STORIES & FEED ===================== */
/* Placeholder: actual logic will be in stories.js and feed-actions.js */
</script>

<!-- =========================================================
     LINK FUTURE JS FILES
========================================================= -->
<script type="module" src="js/profile.js"></script>
<script type="module" src="js/feed-actions.js"></script>
<script type="module" src="js/stories.js"></script>

</body>
</html>
