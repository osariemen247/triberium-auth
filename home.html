<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TRIBERIUM — SocialFi</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/design-system.css">

</head>

<body data-theme="light">

<!-- ===================== HEADER ===================== -->
<header class="header">
  <div class="header-top">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="brand">
      <div class="logo">TRIBERIUM</div>
      <div class="wallet">TBM Balance: <span id="walletAmount">0.00</span></div>
    </div>
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </div>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search TRIBERIUM...">
  </div>
</header>

<!-- ===================== SIDEBAR ===================== -->
<div class="sidebar" id="sidebar">
  <button data-page="profile">Profile</button>
  <button data-page="metrics">Metrics</button>
  <button data-page="news">News</button>
  <button data-page="zytherion">Access Zytherion</button>
  <button data-page="livestream">Live Stream</button>
  <button data-page="saved">Saved Posts</button>
  <button data-page="wallet">Wallet</button>
  <button data-page="settings">Settings</button>
  <button id="logoutBtn">Logout</button>
</div>

<!-- ===================== STORIES ===================== -->
<section class="stories" id="stories"></section>

<!-- ===================== MAIN PAGE CONTAINER ===================== -->
<section class="page" id="pageContainer"></section>

<!-- ===================== BOTTOM NAVIGATION ===================== -->
<nav class="nav">
  <button data-page="home" class="active">Home</button>
  <button data-page="tribe">Tribe</button>
  <button data-page="chat">Chat</button>
  <button data-page="notifications">Notifications</button>
</nav>

<!-- ===================== SCRIPTS ===================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAjX9SLUbKPjldZELBvtQg0K0A-UEDLRIs",
  authDomain: "triberium-mvp.firebaseapp.com",
  projectId: "triberium-mvp",
  storageBucket: "triberium-mvp.firebasestorage.app",
  messagingSenderId: "519861052514",
  appId: "1:519861052514:web:56348e80320066cd311d3b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* ================= WALLET ================= */
async function loadWallet(uid){
  try{
    const snap = await getDoc(doc(db,"wallets",uid));
    if(snap.exists()){
      document.getElementById("walletAmount").textContent =
        snap.data().balance.toFixed(2);
    }
  }catch(e){ console.error(e); }
}

onAuthStateChanged(auth,user=>{
  if(user) loadWallet(user.uid);
  else console.log("User not signed in");
});

/* ================= SIDEBAR TOGGLE ================= */
const sidebar=document.getElementById("sidebar");
document.getElementById("menuBtn").addEventListener("click",()=>sidebar.classList.toggle("active"));

/* ================= THEME TOGGLE ================= */
document.getElementById("themeToggle").addEventListener("click",()=>{
  const body=document.body;
  const toggle=document.getElementById("themeToggle");
  if(body.dataset.theme==="light"){
    body.dataset.theme="dark"; toggle.textContent="☀️";
  }else{
    body.dataset.theme="light"; toggle.textContent="🌙";
  }
});

/* ================= STORIES ================= */
const storiesData=["Alice","Bob","Carol","Dave","Eve"];
const storiesContainer=document.getElementById("stories");
storiesData.forEach(user=>{
  const story=document.createElement("div");
  story.className="story";
  story.innerHTML=`
    <img src="https://picsum.photos/100?random=${Math.random()}" />
    <span>@${user}</span>
  `;
  story.addEventListener("click",()=>alert(`Viewing ${user}'s Story (24h lifespan)`));
  storiesContainer.appendChild(story);
});

/* ================= POSTS / FEED ================= */
const feedPosts=[
  {user:"TriberiumUser",content:"Welcome to TRIBERIUM SocialFi evolution."},
  {user:"Alice",content:"Exploring new digital assets today!"}
];

const pageContainer=document.getElementById("pageContainer");

function renderFeed(posts){
  pageContainer.innerHTML="";
  posts.forEach(p=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="post-header">
        <div class="post-user">
          <div class="avatar"></div>
          <div>@${p.user}</div>
        </div>
        <button class="follow-btn">Follow</button>
      </div>
      <div class="post-content">${p.content}</div>
      <div class="post-actions">
        <div class="action like">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6-4.35-10-10C2 6 5 2 12 6c7-4 10 0 10 5s-6 10-10 10z"></path></svg> Like
        </div>
        <div class="action retribe">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"></path></svg> Retribe
        </div>
        <div class="action save">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 4l16 16"></path></svg> Save
        </div>
        <div class="action comment">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v12H5l-1 4V4z"></path></svg> Comment
        </div>
        <div class="action share">
          <svg viewBox="0 0 24 24"><path d="M4 12h16M12 4l8 8-8 8"></path></svg> Share
        </div>
      </div>
    `;
    card.querySelectorAll(".action").forEach(btn=>btn.addEventListener("click",()=>btn.classList.toggle("active")));
    pageContainer.appendChild(card);
  });
}

// Initial feed render
renderFeed(feedPosts);

/* ================= BOTTOM NAV ================= */
document.querySelectorAll(".nav button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const page = btn.dataset.page;
    alert(`Loading page: ${page}`); // Placeholder for real dynamic routing
  });
});

/* ================= SIDEBAR NAVIGATION ================= */
sidebar.querySelectorAll("button[data-page]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const page = btn.dataset.page;
    alert(`Loading page: ${page}`); // Placeholder for modular page loading
    sidebar.classList.remove("active");
  });
});

/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").addEventListener("click",()=>{
  signOut(auth).then(()=>alert("Logged out")).catch(e=>console.error(e));
});

/* ================= SEARCH ================= */
document.getElementById("searchInput").addEventListener("input",(e)=>{
  console.log("Search query:", e.target.value); // Placeholder for real search function
});
</script>

</body>
</html>
