<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TRIBERIUM — SocialFi</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
</head>

<body data-theme="light">

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="header-top">

    <button id="menuBtn" class="menu-btn" aria-label="Toggle Navigation">
      ☰
    </button>

    <div class="brand">
      <div class="logo">TRIBERIUM</div>
      <div class="wallet">
        TBM Balance:
        <span id="walletAmount">0.00</span>
      </div>
    </div>

    <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
      🌙
    </button>

  </div>

  <div class="search">
    <input
      id="searchInput"
      type="text"
      autocomplete="off"
      spellcheck="false"
      placeholder="Search TRIBERIUM..."
    >
  </div>
</header>


<!-- ================= SIDEBAR ================= -->
<aside id="sidebar" class="sidebar">

  <button data-route="profile">Profile</button>
  <button data-route="metrics">Metrics</button>
  <button data-route="news">News</button>
  <button data-route="zytherion">Access Zytherion</button>
  <button data-route="livestream">Live Stream</button>
  <button data-route="saved">Saved Posts</button>
  <button data-route="wallet">Wallet</button>
  <button data-route="settings">Settings</button>
  <button id="logoutBtn">Logout</button>

</aside>


<!-- ================= STORIES ================= -->
<section id="stories" class="stories"></section>


<!-- ================= PAGE CONTAINER ================= -->
<main id="pageContainer" class="page"></main>


<!-- ================= BOTTOM NAV ================= -->
<nav class="nav">

  <button data-route="home" class="active">Home</button>
  <button data-route="tribe">Tribe</button>
  <button data-route="chat">Chat</button>
  <button data-route="notifications">Notifications</button>

</nav>



<!-- ================= MAIN APP BOOTSTRAP ================= -->
<script type="module">

/* ================= CORE ================= */
import { auth } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= CONTROLLERS ================= */
import { initRouter } from "./js/router.js";
import { initSidebar } from "./js/sidebar.js";
import { initTheme } from "./js/theme.js";
import { initWalletListener } from "./js/wallet.js";
import { initSearch } from "./js/search.js";
import { initStoriesRealtime } from "./js/stories.js";
import { initFeedRealtime } from "./js/feed.js";
import { initBottomNav } from "./js/nav.js";

/* ================= AUTH GUARD ================= */
onAuthStateChanged(auth, user => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  /* ===== REALTIME MODULE INIT ===== */
  initTheme();
  initSidebar();
  initRouter();
  initBottomNav();

  initWalletListener(user.uid);
  initStoriesRealtime();
  initFeedRealtime();
  initSearch();

});

</script>

</body>
</html>
