<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TRIBERIUM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f1419;
  --panel: #161b22;
  --border: #2f3336;
  --text: #e7e9ea;
  --muted: #71767b;
  --accent: #9b59b6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.auth {
  width: 100%;
  max-width: 420px;
  padding: 32px;
}

h1 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 6px;
  text-align:center;
  animation: logoPulse 1.5s infinite;
  cursor:pointer;
}

@keyframes logoPulse {
  0% { transform: scale(1); color: #9b59b6; }
  50% { transform: scale(1.1); color: #6f3490; }
  100% { transform: scale(1); color: #9b59b6; }
}

.subtitle {
  color: var(--muted);
  text-align:center;
  margin-bottom: 28px;
  font-weight:500;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 15px;
}

input:focus {
  outline: none;
  border-color: var(--accent);
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}

.primary {
  background: var(--accent);
  color: #fff;
}

.secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}

button:hover {
  opacity: 0.95;
}

.divider {
  display: flex;
  align-items: center;
  margin: 22px 0;
  color: var(--muted);
  font-size: 13px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.divider span {
  margin: 0 12px;
}

#authMessage {
  margin-top: 14px;
  font-size: 14px;
  text-align:center;
}

/* =======================================
   Forgot Password Modal
======================================= */
#forgotModal {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-content {
  background: var(--panel);
  padding: 28px;
  border-radius: 12px;
  max-width: 380px;
  width: 90%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.modal-content h2 {
  margin:0;
  font-size:20px;
  font-weight:600;
  text-align:center;
}

.modal-content input {
  margin-bottom:0;
}

.modal-content .modal-btns {
  display:flex;
  gap:12px;
  margin-top:10px;
}

.modal-content .modal-btns button {
  flex:1;
}
</style>
</head>

<body>

<div class="auth">
  <h1 onclick="navigateHome()">TRIBERIUM</h1>
  <div class="subtitle">Connect, Create, Earn, Belong</div>

  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">

  <button class="primary" id="login">Log in</button>
  <button class="secondary" id="signup">Create account</button>

  <div class="divider"><span>or</span></div>

  <button class="secondary" id="google">Continue with Google</button>

  <div style="margin-top:10px; text-align:center;">
    <button id="forgotPassword" class="secondary">Forgot Password?</button>
  </div>

  <div id="authMessage"></div>
</div>

<!-- Forgot Password Modal -->
<div id="forgotModal">
  <div class="modal-content">
    <h2>Reset Password</h2>
    <input id="resetEmail" type="email" placeholder="Enter your email">
    <div class="modal-btns">
      <button class="primary" id="sendReset">Send Link</button>
      <button class="secondary" id="cancelReset">Cancel</button>
    </div>
    <div id="resetMsg" style="font-size:13px; text-align:center; margin-top:6px;"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjX9SLUbKPjldZELBvtQg0K0A-UEDLRIs",
  authDomain: "triberium-mvp.firebaseapp.com",
  projectId: "triberium-mvp",
  appId: "1:519861052514:web:56348e80320066cd311d3b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const msg = document.getElementById("authMessage");

function navigateHome(){
  window.location.href = "home.html";
}

signup.onclick = async () => {
  try {
    await createUserWithEmailAndPassword(auth, email.value, password.value);
    msg.textContent = "Account created successfully!";
    msg.style.color = "#9b59b6";
    setTimeout(navigateHome, 800);
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = "#f4212e";
  }
};

login.onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
    msg.textContent = "Logged in successfully!";
    msg.style.color = "#9b59b6";
    setTimeout(navigateHome, 800);
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = "#f4212e";
  }
};

google.onclick = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
    navigateHome();
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = "#f4212e";
  }
};

// Auto redirect if already logged in
onAuthStateChanged(auth, user => {
  if(user){
    navigateHome();
  }
});

// Forgot Password Logic
const forgotModal = document.getElementById("forgotModal");
const forgotBtn = document.getElementById("forgotPassword");
const cancelReset = document.getElementById("cancelReset");
const sendReset = document.getElementById("sendReset");
const resetEmail = document.getElementById("resetEmail");
const resetMsg = document.getElementById("resetMsg");

forgotBtn.onclick = () => {
  resetEmail.value = "";
  resetMsg.textContent = "";
  forgotModal.style.display = "flex";
};

cancelReset.onclick = () => {
  forgotModal.style.display = "none";
};

sendReset.onclick = async () => {
  const emailVal = resetEmail.value.trim();
  if(!emailVal){
    resetMsg.textContent = "Enter a valid email";
    resetMsg.style.color = "#f4212e";
    return;
  }
  try {
    await sendPasswordResetEmail(auth, emailVal);
    resetMsg.textContent = "Reset link sent! Check your email.";
    resetMsg.style.color = "#9b59b6";
  } catch(e) {
    resetMsg.textContent = e.message;
    resetMsg.style.color = "#f4212e";
  }
};
</script>

</body>
                                                         </html>
