<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIBERIUM — Stories</title>
<link rel="stylesheet" href="css/stories.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="light">

<section class="stories" id="stories">
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=1">
    <span>@alice</span>
  </div>
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=2">
    <span>@bob</span>
  </div>
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=3">
    <span>@charlie</span>
  </div>
</section>

<!-- Story Modal -->
<div class="story-modal" id="storyModal">
  <div class="modal-content">
    <span id="closeStoryModal" class="close-btn">×</span>
    <img id="storyImage" src="" alt="Story">
    <div id="storyUsername"></div>
  </div>
</div>

<script type="module" src="js/stories.js"></script>
</body>
</html>
