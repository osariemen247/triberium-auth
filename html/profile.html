<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIBERIUM — Profile</title>
<link rel="stylesheet" href="css/profile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="light">

<header class="header">
  <div class="header-top">
    <div class="logo">TRIBERIUM</div>
    <div class="wallet">TBM Balance: <span id="walletAmount">0.00</span></div>
  </div>
</header>

<section class="profile-info">
  <div class="avatar-container">
    <img src="https://i.pravatar.cc/150" class="profile-avatar" alt="Avatar">
    <button id="editProfileBtn" class="btn-edit">Edit Profile</button>
  </div>
  <div class="username">@john_doe</div>
  <button id="profileFollowBtn" class="btn-follow">Follow</button>
  <div class="profile-stats">
    <span>Posts: 120</span>
    <span>Followers: 2.4k</span>
    <span>Following: 180</span>
  </div>
</section>

<section class="profile-posts" id="profilePosts">
  <!-- Posts dynamically loaded here -->
  <div class="profile-post" data-post-id="post1">
    <div class="post-header">
      <img src="https://i.pravatar.cc/50" class="avatar">
      <span>@john_doe</span>
    </div>
    <div class="post-content">This is a sample profile post content with full text and rich detail.</div>
    <div class="post-actions">
      <div class="action like">Like</div>
      <div class="action save">Save</div>
      <div class="action retribe">Retribe</div>
      <div class="action comment">Comment</div>
      <div class="action share">Share</div>
    </div>
  </div>
</section>

<!-- Edit Profile Modal -->
<div class="profile-modal" id="editProfileModal">
  <div class="modal-content">
    <h3>Edit Profile</h3>
    <input type="text" id="editUsername" placeholder="Username">
    <input type="text" id="editBio" placeholder="Bio">
    <input type="url" id="editAvatar" placeholder="Avatar URL">
    <div class="modal-actions">
      <button id="saveProfileBtn">Save</button>
      <button id="closeEditProfile" class="cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Comment Modal for Profile Posts -->
<div class="profile-modal" id="profileCommentModal">
  <div class="modal-content">
    <textarea id="profileCommentText" placeholder="Write a comment..."></textarea>
    <button id="submitProfileComment">Post Comment</button>
  </div>
</div>

<script type="module" src="js/profile.js"></script>
</body>
      </html>
