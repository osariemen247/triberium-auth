<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triberium — Profile</title>

  <!-- Global + Profile Styles -->
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/profile.css">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body data-theme="light">

<!-- ========== HEADER ========== -->
<header class="header">
  <div class="header-left">
    <div class="logo">TRIBERIUM</div>
  </div>

  <div class="header-right">
    <div class="wallet">
      TBM Balance: <span id="walletAmount">0.00</span>
    </div>
  </div>
</header>

<!-- ========== LAYOUT WRAPPER ========== -->
<div class="layout">

  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar" id="sidebar">

    <a href="home.html" class="sidebar-link">Home</a>
    <a href="profile.html" class="sidebar-link active">Profile</a>
    <a href="metrics.html" class="sidebar-link">Metrics</a>
    <a href="news.html" class="sidebar-link">News</a>
    <a href="settings.html" class="sidebar-link">Settings</a>

  </aside>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main-content">

    <!-- PROFILE HEADER -->
    <section class="profile-header">

      <div class="profile-avatar-wrapper">
        <img id="profileAvatar" class="profile-avatar" alt="User Avatar">
      </div>

      <div class="profile-details">
        <h2 id="profileUsername"></h2>
        <p id="profileBio"></p>

        <div class="profile-stats">
          <span><strong id="postCount">0</strong> Posts</span>
          <span><strong id="followerCount">0</strong> Followers</span>
          <span><strong id="followingCount">0</strong> Following</span>
        </div>

        <button id="editProfileBtn" class="btn-primary">
          Edit Profile
        </button>
      </div>

    </section>

    <!-- CREATE POST SECTION -->
    <section class="create-post">

      <textarea id="postText" placeholder="Share something with your tribe..."></textarea>

      <div class="media-upload">
        <input type="file" id="mediaInput" accept="image/*,video/*">
      </div>

      <button id="publishPostBtn" class="btn-primary">
        Publish
      </button>

    </section>

    <!-- USER POSTS -->
    <section id="profilePosts" class="posts-container">
      <!-- Posts dynamically inserted by profile.js -->
    </section>

  </main>

</div>

<!-- ========== EDIT PROFILE MODAL ========== -->
<div class="modal hidden" id="editProfileModal">

  <div class="modal-content">
    <h3>Edit Profile</h3>

    <input type="text" id="editUsername" placeholder="Username">
    <input type="text" id="editBio" placeholder="Bio">
    <input type="url" id="editAvatar" placeholder="Avatar URL">

    <div class="modal-actions">
      <button id="saveProfileBtn" class="btn-primary">Save</button>
      <button id="closeEditProfile" class="btn-secondary">Cancel</button>
    </div>
  </div>

</div>

<!-- ========== SCRIPTS ========== -->
<script type="module" src="js/profile.js"></script>

</body>
  </html>
