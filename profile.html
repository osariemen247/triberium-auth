<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIBERIUM — Profile</title>
  <link rel="stylesheet" href="css/profile.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="light">

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="header-top">
      <div class="logo">TRIBERIUM</div>
      <div class="wallet">TBM Balance: <span id="walletAmount">0.00</span></div>
      <button id="messagingBtn" class="btn-message">Messages</button>
    </div>
  </header>

  <!-- ================= PROFILE INFO ================= -->
  <section class="profile-info">
    <div class="avatar-container">
      <img id="profileAvatar" src="" alt="Profile Avatar" class="profile-avatar">
      <button id="editProfileBtn" class="btn-edit">Edit Profile</button>
    </div>
    <div class="username" id="profileUsername">@username</div>
    <div class="bio" id="profileBio"></div>
    <div class="profile-stats">
      <span>Posts: <span id="postCount">0</span></span>
      <span>Followers: <span id="followerCount">0</span></span>
      <span>Following: <span id="followingCount">0</span></span>
    </div>
  </section>

  <!-- ================= CREATE POST ================= -->
  <section class="create-post">
    <textarea id="postText" placeholder="What's happening?"></textarea>
    <input type="file" id="mediaInput" multiple accept="image/*,video/*">
    <div id="mediaPreview" class="media-preview"></div>
    <button id="publishPostBtn" class="btn-publish">Post</button>
  </section>

  <!-- ================= STORIES ================= -->
  <section class="stories-section">
    <h3>Stories</h3>
    <div class="story-upload">
      <input type="file" id="storyInput" multiple accept="image/*,video/*">
      <div id="storyPreview" class="story-preview"></div>
      <button id="uploadStoryBtn" class="btn-upload-story">Upload Story</button>
    </div>
    <div id="stories" class="stories-container"></div>
  </section>

  <!-- ================= PROFILE POSTS ================= -->
  <section class="profile-posts" id="profilePosts">
    <!-- Posts loaded dynamically -->
  </section>

  <!-- ================= EDIT PROFILE MODAL ================= -->
  <div class="profile-modal hidden" id="editProfileModal">
    <div class="modal-content">
      <h3>Edit Profile</h3>
      <input type="text" id="editUsername" placeholder="Username">
      <input type="text" id="editBio" placeholder="Bio">
      <input type="url" id="editAvatar" placeholder="Avatar URL">
      <div class="modal-actions">
        <button id="saveProfileBtn" class="btn-save">Save</button>
        <button id="closeEditProfile" class="btn-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ================= COMMENT MODAL (Dynamic) ================= -->
  <!-- Will be handled via JS prompt/modal -->

  <script type="module" src="js/profile.js"></script>
</body>
        </html>
