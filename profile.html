<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIBERIUM — Profile</title>
  <link rel="stylesheet" href="css/profile.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="light">

  <!-- HEADER -->
  <header class="header">
    <div class="header-top">
      <div class="logo">TRIBERIUM</div>
      <div class="wallet">TBM Balance: <span id="walletAmount">0.00</span></div>
      <button id="messagingBtn" class="btn-message">Messages</button>
    </div>
  </header>

  <!-- PROFILE INFO -->
  <section class="profile-info">
    <div class="avatar-container">
      <img src="" id="profileAvatar" class="profile-avatar" alt="Avatar">
      <button id="editProfileBtn" class="btn-edit">Edit Profile</button>
    </div>
    <div id="profileUsername" class="username"></div>
    <div id="profileBio" class="bio"></div>
    <div class="profile-stats">
      <span id="postCount">0</span> Posts
      <span id="followerCount">0</span> Followers
      <span id="followingCount">0</span> Following
    </div>
  </section>

  <!-- MEDIA POST CREATION -->
  <section class="create-post">
    <textarea id="postText" placeholder="What's on your mind?"></textarea>
    <input type="file" id="mediaInput" accept="image/*,video/*">
    <div id="mediaPreview" class="media-preview"></div>
    <button id="publishPostBtn" class="btn-publish">Post</button>
  </section>

  <!-- STORIES UPLOAD -->
  <section class="stories-section">
    <input type="file" id="storyInput" accept="image/*,video/*">
    <div id="storyPreview" class="media-preview"></div>
    <button id="uploadStoryBtn" class="btn-publish">Upload Story</button>
    <div id="stories" class="stories-container"></div>
  </section>

  <!-- PROFILE FEED -->
  <section id="profilePosts" class="profile-posts">
    <!-- Posts (personal + retribed) dynamically rendered by JS -->
  </section>

  <!-- EDIT PROFILE MODAL -->
  <div class="profile-modal hidden" id="editProfileModal">
    <div class="modal-content">
      <h3>Edit Profile</h3>
      <input type="text" id="editUsername" placeholder="Username">
      <input type="text" id="editBio" placeholder="Bio">
      <input type="url" id="editAvatar" placeholder="Avatar URL">
      <div class="modal-actions">
        <button id="saveProfileBtn" class="btn-save">Save</button>
        <button id="closeEditProfile" class="btn-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE + PROFILE JS -->
  <script type="module" src="js/profile.js"></script>

</body>
  </html>
